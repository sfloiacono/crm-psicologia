<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>Consultorio Psiconflor</title>
<meta name="description" content="Organizador de pacientes para consultorio de psicología">
<meta name="theme-color" content="#F8F3F1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<body>
